---
- name: Verify Ubuntu
  hosts: all
  become: true
  tasks:
    - name: Debug SSH config content
      ansible.builtin.command: cat /etc/ssh/sshd_config.d/00-baseline.conf
      register: debug_conf
      changed_when: false

    - name: Show SSH config
      ansible.builtin.debug:
        msg: "{{ debug_conf.stdout_lines }}"

    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert UFW is installed
      ansible.builtin.assert:
        that: "'ufw' in ansible_facts.packages"
        fail_msg: "UFW is not installed"

    - name: Assert fail2ban is installed
      ansible.builtin.assert:
        that: "'fail2ban' in ansible_facts.packages"
        fail_msg: "fail2ban is not installed"
