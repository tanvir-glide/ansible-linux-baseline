---
name: Molecule CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  molecule:
    name: Molecule — ${{ matrix.scenario }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        scenario:
          - ubuntu
          - rocky
          - debian

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and Molecule
        run: |
          python -m pip install --upgrade pip
          pip install \
            ansible-core \
            molecule \
            "molecule-plugins[podman]" \
            ansible-lint

      - name: Install required Ansible collections
        run: |
          ansible-galaxy collection install \
            ansible.posix \
            community.general

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Run Molecule tests
        run: molecule test -s ${{ matrix.scenario }}
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          ANSIBLE_VERBOSITY: "2"
