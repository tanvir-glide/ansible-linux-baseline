---
- name: Install fail2ban
  ansible.builtin.package:
    name: fail2ban
    state: present
  tags: security

- name: Configure fail2ban
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.conf
    mode: "0644"
    content: |
      [sshd]
      enabled  = true
      backend  = systemd
      port     = {{ linux_baseline_ssh_port }}
      maxretry = 5
      bantime  = 24h
      findtime = 10m
      ignoreip = 127.0.0.1/8 ::1 100.64.0.0/10
  notify: Restart fail2ban service
  tags: security

- name: Ensure auth.log exists (required for fail2ban on Debian)
  ansible.builtin.command:
    cmd: "touch {{ linux_baseline_auth_log }}"
    creates: "{{ linux_baseline_auth_log }}"
  when: ansible_facts['os_family'] == "Debian"
  tags: security

- name: Set permissions on auth.log
  ansible.builtin.file:
    path: "{{ linux_baseline_auth_log }}"
    owner: root
    group: adm
    mode: "0640"
  when: ansible_facts['os_family'] == "Debian"
  tags: security

- name: Start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
  tags: security
