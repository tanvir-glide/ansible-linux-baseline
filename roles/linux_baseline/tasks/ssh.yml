---
- name: SSH Hardening
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop:
    - { regexp: "^#?Port", line: "Port {{ linux_baseline_ssh_port }}" }
    - { regexp: "^#?PermitRootLogin", line: "PermitRootLogin no" }
    - { regexp: "^#?PasswordAuthentication", line: "PasswordAuthentication no" }
    - { regexp: "^#?PubkeyAuthentication", line: "PubkeyAuthentication yes" }
    - { regexp: "^#?KbdInteractiveAuthentication", line: "KbdInteractiveAuthentication no" }
    - { regexp: "^#?AllowTcpForwarding", line: "AllowTcpForwarding no" }
    - { regexp: "^#?ClientAliveCountMax", line: "ClientAliveCountMax 2" }
    - { regexp: "^#?LogLevel", line: "LogLevel VERBOSE" }
    - { regexp: "^#?MaxAuthTries", line: "MaxAuthTries 3" }
    - { regexp: "^#?MaxSessions", line: "MaxSessions 2" }
    - { regexp: "^#?TCPKeepAlive", line: "TCPKeepAlive no" }
    - { regexp: "^#?X11Forwarding", line: "X11Forwarding no" }
    - { regexp: "^#?AllowAgentForwarding", line: "AllowAgentForwarding no" }
  notify: Restart ssh service
  tags: ssh

- name: Remove cloud-init sshd override
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
    state: absent
  notify: Restart ssh service
  tags: ssh

- name: Ensure target user exists in admin group
  ansible.builtin.user:
    name: "{{ linux_baseline_username }}"
    groups: "{{ linux_baseline_admin_group }}"
    append: true
    shell: /bin/bash
  when: linux_baseline_username != "your_username"
  tags: ssh

- name: Deploy public key for target user
  ansible.posix.authorized_key:
    user: "{{ linux_baseline_username }}"
    key: "{{ lookup('file', linux_baseline_pub_key) }}"
  when: linux_baseline_username != "your_username"
  tags: ssh
