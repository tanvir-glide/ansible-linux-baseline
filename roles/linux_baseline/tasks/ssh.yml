---
- name: SSH Hardening
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-baseline.conf
    mode: "0644"
    content: |
      Port {{ linux_baseline_ssh_port }}
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      KbdInteractiveAuthentication no
      AllowTcpForwarding no
      ClientAliveCountMax 2
      LogLevel VERBOSE
      MaxAuthTries 3
      MaxSessions 2
      TCPKeepAlive no
      X11Forwarding no
      AllowAgentForwarding no
  notify: Restart ssh service
  tags: ssh

- name: Remove cloud-init sshd override
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
    state: absent
  notify: Restart ssh service
  tags: ssh

- name: Ensure target user exists in admin group
  ansible.builtin.user:
    name: "{{ linux_baseline_username }}"
    groups: "{{ linux_baseline_admin_group }}"
    append: true
    shell: /bin/bash
  when: linux_baseline_username != "your_username"
  tags: ssh

- name: Deploy public key for target user
  ansible.posix.authorized_key:
    user: "{{ linux_baseline_username }}"
    key: "{{ lookup('file', linux_baseline_pub_key) }}"
  when: linux_baseline_username != "your_username"
  tags: ssh
