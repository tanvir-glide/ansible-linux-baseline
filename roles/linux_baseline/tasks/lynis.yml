# =======================
# DEBIAN-SPECIFIC TASKS
# =======================
- name: Ensuring libpam-tmpdir is installed for PAM session isolation [AUTH-9262]
  ansible.builtin.apt:
    name: libpam-tmpdir
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"
  tags: lynis

- name: Ensuring apt-listchanges is installed for change tracking [PKGS-7388]
  ansible.builtin.apt:
    name: apt-listchanges
    state: present
  when: ansible_facts['os_family'] == "Debian"
  tags: lynis

- name: Ensuring auditd is installed
  ansible.builtin.package:
    name: "{{ linux_baseline_audit_package }}"
    state: present
  tags: lynis

- name: Configure apt-listchanges for non-interactive automation
  ansible.builtin.debconf:
    name: apt-listchanges
    question: apt-listchanges/confirm
    value: "false"
    vtype: select
  when: ansible_facts['os_family'] == "Debian"
  tags: lynis

# ==================
# UNIVERSAL TASKS
# ==================

- name: Ensuring Fail2ban is installed
  ansible.builtin.package:
    name: fail2ban
    state: present
  tags: lynis

- name: Copy Fail2ban jail.conf to jail.local to protect configuration override [TOOL-5102]
  ansible.builtin.copy:
    src: /etc/fail2ban/jail.conf
    dest: /etc/fail2ban/jail.local
    remote_src: true
    force: false
    mode: "0644"
  tags: lynis

- name: Restrict system crontab permission [FILE-7524]
  ansible.builtin.file:
    path: /etc/crontab
    state: touch
    mode: "0600"
    owner: root
    group: root
    modification_time: preserve
    access_time: preserve
  tags: lynis

# ==================
# KERNEL PARAMETERS
# ==================

- name: Applying kernel parameters
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-custom.conf
    mode: "0644"
    content: |
      net.ipv4.tcp_syncookies = 1
      net.ipv4.conf.all.rp_filter = 2
      net.ipv4.conf.default.rp_filter = 2
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv4.conf.all.secure_redirects = 0
      net.ipv4.conf.default.secure_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.default.send_redirects = 0
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv4.conf.default.accept_source_route = 0
      net.ipv4.conf.all.log_martians = 1
      net.ipv4.conf.default.log_martians = 1
      net.ipv4.icmp_echo_ignore_broadcasts = 1
      net.ipv4.icmp_ignore_bogus_error_responses = 1
      net.ipv6.conf.all.accept_redirects = 0
      net.ipv6.conf.default.accept_redirects = 0
      net.ipv6.conf.all.accept_source_route = 0
      net.ipv6.conf.default.accept_source_route = 0
      kernel.randomize_va_space = 2
      kernel.sysrq = 0
      kernel.core_uses_pid = 1
      kernel.dmesg_restrict = 1
      kernel.kptr_restrict = 2
      kernel.yama.ptrace_scope = 1
      kernel.unprivileged_bpf_disabled = 1
      kernel.kexec_load_disabled = 1
      net.core.bpf_jit_harden = 2
      dev.tty.ldisc_autoload = 0
      fs.protected_hardlinks = 1
      fs.protected_symlinks = 1
      fs.protected_fifos = 2
      fs.protected_regular = 2
      fs.suid_dumpable = 0
  notify: Reload sysctl
  tags: lynis
