---
- name: Restart ssh service
  ansible.builtin.systemd:
    name: "{{ linux_baseline_ssh_service }}"
    state: restarted

- name: Restart fail2ban service
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  failed_when: false

- name: Reload firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: reloaded

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  failed_when: false

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
